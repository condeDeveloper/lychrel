name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: Varredura ate dez mil
        run: mvn -B -ntp -q exec:java -Dexec.args="varredura"

      - name: Quem bate recorde de passos
        run: mvn -B -ntp -q exec:java -Dexec.args="recordes"

      - name: Os que nao chegam
        run: mvn -B -ntp -q exec:java -Dexec.args="candidatos"

      - name: BigInteger contra long
        run: mvn -B -ntp -q exec:java -Dexec.args="juiz"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports

  fundo:
    # Um milhao de numeros em BigInteger: cento e cinco segundos. O job confere
    # as proprias cinco medidas e quebra se alguma mudar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Varredura ate um milhao
        run: mvn -B -ntp -q compile exec:java -Dexec.args="fundo"
